<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b2118">
  <title>米至上主義 ご注文</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- スタート画面 -->
  <section id="screen-start" class="screen start-screen">
    <p class="start-welcome">いらっしゃいませ</p>
    <h1 class="start-name" id="start-name"></h1>
    <button type="button" id="btn-start" class="btn primary big">ご注文をはじめる</button>
  </section>

  <!-- テーブル番号入力画面 -->
  <section id="screen-table" class="screen table-screen" hidden>
    <p class="small-store" data-store-name></p>
    <h2 class="table-title">テーブル番号を入力してください</h2>
    <p class="table-hint" id="table-hint"></p>
    <form id="table-form" class="table-form" novalidate>
      <label for="table-input" class="visually-hidden">テーブル番号</label>
      <input id="table-input" class="table-input" type="text" inputmode="numeric" autocomplete="off" maxlength="3" placeholder="例：5">
      <p id="table-error" class="error-text" role="alert" hidden></p>
      <button type="submit" class="btn primary big">注文を始める</button>
    </form>
    <button type="button" id="btn-table-back" class="btn text">‹ 戻る</button>
  </section>

  <!-- メイン画面 -->
  <section id="screen-main" class="screen main-screen" hidden>
    <header class="main-header">
      <div class="hdr-left">
        <span class="hdr-store" data-store-name></span>
        <button type="button" class="hdr-table" id="hdr-table" title="テーブル番号を変更"></button>
      </div>
      <time class="hdr-clock" id="hdr-clock">--:--</time>
    </header>

    <nav class="cat-bar" id="cat-bar" aria-label="カテゴリ"></nav>

    <div class="allergy-bar">
      <button type="button" class="allergy-toggle" id="btn-allergy" aria-expanded="false" aria-controls="allergy-panel"></button>
      <div class="allergy-panel" id="allergy-panel" hidden></div>
    </div>

    <main class="content" id="content"></main>

    <footer class="main-footer">
      <div class="ftr-total">
        <span class="ftr-label">現在の料金</span>
        <span class="ftr-amount" id="ftr-total">0円</span>
      </div>
      <button type="button" class="btn primary" id="btn-basket">
        かごへ進む<span class="count-badge" id="basket-count" hidden>0</span>
      </button>
    </footer>
  </section>

  <!-- 商品の選択画面 -->
  <div id="detail" class="overlay" hidden role="dialog" aria-modal="true" aria-label="商品の選択"></div>

  <!-- 注文確認画面（かご） -->
  <div id="basket" class="overlay" hidden role="dialog" aria-modal="true" aria-label="ご注文内容の確認">
    <header class="ov-header">
      <button type="button" class="btn-back" data-close="basket">‹ 戻る</button>
      <h2 class="ov-title">ご注文内容の確認</h2>
      <span class="ov-sub" id="basket-table"></span>
    </header>
    <div class="ov-body" id="basket-body"></div>
    <footer class="ov-footer">
      <div class="ov-total"><span>合計</span><strong id="basket-total">0円</strong></div>
      <button type="button" class="btn primary" id="btn-order">注文を確定する</button>
    </footer>
  </div>

  <!-- 注文履歴 -->
  <div id="history" class="overlay" hidden role="dialog" aria-modal="true" aria-label="注文履歴">
    <header class="ov-header">
      <button type="button" class="btn-back" data-close="history">‹ 戻る</button>
      <h2 class="ov-title">注文履歴</h2>
      <span class="ov-sub" id="history-table"></span>
    </header>
    <div class="ov-body" id="history-body"></div>
    <footer class="ov-footer">
      <div class="ov-total"><span>未会計</span><strong id="history-unpaid">0円</strong></div>
      <button type="button" class="btn primary" id="btn-checkout" disabled>会計する</button>
    </footer>
  </div>

  <!-- 確認ダイアログ -->
  <div id="dialog" class="dialog-backdrop" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-message">
      <h3 class="dialog-title" id="dialog-title"></h3>
      <p class="dialog-message" id="dialog-message"></p>
      <div class="dialog-actions">
        <button type="button" class="btn" id="dialog-cancel"></button>
        <button type="button" class="btn primary" id="dialog-ok"></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
